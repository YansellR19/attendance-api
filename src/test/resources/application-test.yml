spring:
  datasource:
    url: jdbc:h2:mem:attendance_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  timezone: America/Santo_Domingo
  jwt:
    secret: TestJwtSecretKeyMustBeAtLeast32CharactersLongForHS256Algorithm!
    expiration-ms: 3600000
  seed:
    enabled: true
    demo-attendance: false
